# NPD login theme: Figma "NPD-InfosGroup", frame Login (18:150).
# base only brings the templates and scripts (no PatternFly), so every page renders
# with the NPD atoms in resources/css/atoms.css through the kc* class mappings below.
parent=base
locales=es

styles=css/fonts.css css/tokens.css css/atoms.css css/login.css
meta=viewport==width=device-width,initial-scale=1

## Layout
kcHtmlClass=npd
kcBodyClass=npd-body
kcLoginClass=npd-login
kcFormCardClass=npd-card
kcFormHeaderClass=npd-card__header
kcContentWrapperClass=npd-required
kcSignUpClass=npd-info
kcInfoAreaWrapperClass=npd-info__text
kcSrOnlyClass=npd-sr-only

## Alert
kcAlertClass=npd-alert
kcAlertTitleClass=npd-alert__text
kcFeedbackErrorIcon=npd-alert__icon
kcFeedbackWarningIcon=npd-alert__icon
kcFeedbackSuccessIcon=npd-alert__icon
kcFeedbackInfoIcon=npd-alert__icon

## Form
kcFormClass=npd-stack
kcFormGroupClass=npd-field
kcFormGroupErrorClass=npd-field--error
kcFormGroupHeader=npd-field-group
kcLabelClass=npd-label
kcLabelWrapperClass=npd-field__label
kcInputWrapperClass=npd-field__control
kcInputClass=npd-input
kcTextareaClass=npd-input
kcInputErrorMessageClass=npd-field__error
kcInputHelperTextBeforeClass=npd-field__help
kcInputHelperTextAfterClass=npd-field__help
kcInputGroup=npd-input-group
kcFormSettingClass=npd-options
kcFormOptionsClass=npd-options__left
kcFormOptionsWrapperClass=npd-options__links
kcFormButtonsClass=npd-actions

## Checkbox / radio
kcInputClassCheckbox=npd-checkbox
kcInputClassCheckboxInput=npd-checkbox__input
kcInputClassCheckboxLabel=npd-checkbox__label
kcInputClassRadio=npd-checkbox
kcInputClassRadioInput=npd-checkbox__input npd-checkbox__input--radio
kcInputClassRadioLabel=npd-checkbox__label
kcInputClassRadioCheckboxLabelDisabled=npd-checkbox--disabled
kcCheckClass=npd-checkbox
kcCheckInputClass=npd-checkbox__input
kcCheckLabelClass=npd-checkbox__label

## Buttons
kcButtonClass=npd-button
kcButtonPrimaryClass=npd-button--primary
kcButtonDefaultClass=npd-button--secondary
kcButtonBlockClass=npd-button--block
kcButtonLargeClass=npd-button--large

## Password visibility (passwordVisibility.js swaps these icon classes)
kcFormPasswordVisibilityButtonClass=npd-input-group__toggle
kcFormPasswordVisibilityIconShow=npd-icon npd-icon--eye
kcFormPasswordVisibilityIconHide=npd-icon npd-icon--eye-off

kcResetFlowIcon=npd-icon npd-icon--restart
