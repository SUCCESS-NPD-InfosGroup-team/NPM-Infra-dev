# Global local stack for all NPD-RP microservices: `docker compose up --build`
# Each service lives in its own git submodule; this file only wires them together.
# Inside the Docker network services reach each other by service name
# (postgres:5432, backend:8080, ai-service:8000). Host ports come from .env.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-npd_rp}
      POSTGRES_USER: ${DB_USER:-npd_rp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-npd_rp}
    ports:
      # 5433 avoids a local Windows PostgreSQL on 5432
      - "${DB_PORT:-5433}:5432"
    volumes:
      # Postgres 18 image stores data under /var/lib/postgresql/18/docker
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Applies its own Flyway migrations (NPD-RP-Backend/src/main/resources/db/migration) on start
  backend:
    build: ./NPD-RP-Backend
    environment:
      PORT: 8080
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-npd_rp}
      DB_USER: ${DB_USER:-npd_rp}
      DB_PASSWORD: ${DB_PASSWORD:-npd_rp}
      # Tokens carry the browser URL as issuer; the keys are fetched over the Docker network.
      # Keycloak is not in depends_on: keys are fetched on the first request, so a
      # `docker compose run backend` (planner import) only needs Postgres.
      KEYCLOAK_ISSUER_URI: http://localhost:${KEYCLOAK_PORT:-8081}/realms/npd
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/npd/protocol/openid-connect/certs
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # Identity provider. Local dev mode (HTTP, embedded H2 database kept in the keycloak-data volume).
  # On first start it imports every *.json realm in ./keycloak; realms that already exist are skipped.
  # The realm export is not in git (it holds client secrets): see README > Keycloak.
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.5
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Tokens always carry the browser URL as issuer; containers (backend) can still
      # reach Keycloak at http://keycloak:8080 for keys and token introspection
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8081}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      # 8081 because the backend already uses 8080 on the host
      - "${KEYCLOAK_PORT:-8081}:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak:/opt/keycloak/data/import
      # Login theme "npd" (keycloak/themes/npd); start-dev disables theme caching, so edits show on reload
      - ./keycloak/themes:/opt/keycloak/themes:ro
    healthcheck:
      # The image has no curl/wget; probe the management port with bash
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # --- Frontend (React + Vite) ---
  # Runs the Vite dev server with hot reload; sources are bind-mounted from the submodule.
  # Built from NPD-RP-frontend/Dockerfile.dev.
  frontend:
    build:
      context: ./NPD-RP-frontend
      dockerfile: Dockerfile.dev
    environment:
      # Vite proxies /api to this from inside the container, so it uses the service name
      API_PROXY_TARGET: http://backend:8080
      # File events don't cross Windows bind mounts; vite.config enables polling with this
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./NPD-RP-frontend:/app
      # Keep the container's node_modules instead of the host's
      - /app/node_modules
    depends_on:
      - backend

  # --- AI Service (Python FastAPI) — uncomment once NPD-RP-AI-Service submodule is added ---
  # Expects NPD-RP-AI-Service/Dockerfile, e.g.:
  #   FROM python:3.13-slim
  #   WORKDIR /app
  #   COPY requirements.txt .
  #   RUN pip install --no-cache-dir -r requirements.txt
  #   COPY . .
  #   EXPOSE 8000
  #   CMD ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
  # ai-service:
  #   build: ./NPD-RP-AI-Service
  #   environment:
  #     BACKEND_URL: http://backend:8080
  #     DATABASE_URL: postgresql://${DB_USER:-npd_rp}:${DB_PASSWORD:-npd_rp}@postgres:5432/${DB_NAME:-npd_rp}
  #   ports:
  #     - "${AI_SERVICE_PORT:-8000}:8000"
  #   healthcheck:
  #     test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   depends_on:
  #     backend:
  #       condition: service_healthy

volumes:
  pgdata:
  keycloak-data:
